<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — BookIt</title>
<style>
:root {
  --bg:         #f8fafc;
  --surface:    #ffffff;
  --border:     #e2e8f0;
  --text:       #0f172a;
  --text-muted: #64748b;
  --radius:     10px;
  --shadow-lg:  0 10px 40px rgba(0,0,0,.12);
}
[data-theme="dark"] {
  --bg:         #0f172a;
  --surface:    #1e293b;
  --border:     #334155;
  --text:       #f1f5f9;
  --text-muted: #94a3b8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 2rem;
  width: 100%;
  max-width: 400px;
}
.logo {
  font-size: 1.2rem;
  font-weight: 800;
  letter-spacing: -.02em;
  margin-bottom: 1.75rem;
  color: var(--text);
  text-decoration: none;
  display: block;
}
h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .4rem; }
.sub { font-size: .875rem; color: var(--text-muted); margin-bottom: 1.5rem; }

.form-group { margin-bottom: 1rem; }
label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: .35rem; }
.form-control {
  width: 100%;
  padding: .55rem .75rem;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface);
  color: var(--text);
  font-size: .9rem;
  font-family: inherit;
  transition: border-color .15s;
}
.form-control:focus { outline: none; border-color: var(--text); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  padding: .6rem 1.1rem; border-radius: 7px; font-size: .875rem; font-weight: 600;
  cursor: pointer; border: 1.5px solid transparent; transition: opacity .15s;
  font-family: inherit; text-decoration: none;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); width: 100%; }
.btn-primary:hover:not(:disabled) { opacity: .85; }

.error-msg {
  display: none;
  color: #ef4444;
  font-size: .82rem;
  margin-bottom: .75rem;
}
.success-panel { display: none; text-align: center; padding: .5rem 0; }
.success-icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: #dcfce7; display: flex; align-items: center;
  justify-content: center; margin: 0 auto 1rem;
}
.success-title { font-size: 1.1rem; font-weight: 700; margin-bottom: .4rem; }
.success-sub { font-size: .875rem; color: var(--text-muted); margin-bottom: 1.5rem; }
.invalid-panel { display: none; text-align: center; padding: .5rem 0; }
.invalid-icon {
  width: 52px; height: 52px; border-radius: 50%;
  background: #fee2e2; display: flex; align-items: center;
  justify-content: center; margin: 0 auto 1rem;
}
</style>
</head>
<body>
<div class="card">
  <a class="logo" href="/">BookIt</a>

  <!-- Form panel -->
  <div id="formPanel">
    <h1>Choose a new password</h1>
    <p class="sub">Must be at least 8 characters.</p>
    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input class="form-control" type="password" id="newPassword"
               placeholder="At least 8 characters" autocomplete="new-password" required />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input class="form-control" type="password" id="confirmPassword"
               placeholder="Repeat new password" autocomplete="new-password" required />
      </div>
      <span class="error-msg" id="resetError"></span>
      <button type="submit" class="btn btn-primary" id="resetBtn">Set New Password</button>
    </form>
  </div>

  <!-- Success panel -->
  <div class="success-panel" id="successPanel">
    <div class="success-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="success-title">Password updated!</div>
    <p class="success-sub">Your password has been changed. You can now sign in with your new credentials.</p>
    <a href="/" class="btn btn-primary">Go to sign in</a>
  </div>

  <!-- Invalid token panel -->
  <div class="invalid-panel" id="invalidPanel">
    <div class="invalid-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <div class="success-title" style="color:#dc2626">Link expired</div>
    <p class="success-sub">This reset link is invalid or has expired. Reset links are only valid for 1 hour.</p>
    <a href="/" class="btn btn-primary">Request a new link</a>
  </div>
</div>

<script>
const API = '/api';

// Extract token from URL
const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('formPanel').style.display    = 'none';
  document.getElementById('invalidPanel').style.display = '';
}

document.getElementById('resetForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('newPassword').value;
  const confirm  = document.getElementById('confirmPassword').value;
  const errEl    = document.getElementById('resetError');
  const btn      = document.getElementById('resetBtn');

  errEl.style.display = 'none';
  if (password.length < 8) {
    errEl.textContent   = 'Password must be at least 8 characters.';
    errEl.style.display = '';
    return;
  }
  if (password !== confirm) {
    errEl.textContent   = 'Passwords do not match.';
    errEl.style.display = '';
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch(`${API}/auth/reset-password`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ token, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not reset password.');
    document.getElementById('formPanel').style.display    = 'none';
    document.getElementById('successPanel').style.display = '';
  } catch (err) {
    const isExpired = (err.message || '').toLowerCase().includes('invalid or has expired');
    if (isExpired) {
      document.getElementById('formPanel').style.display    = 'none';
      document.getElementById('invalidPanel').style.display = '';
    } else {
      errEl.textContent   = err.message || 'Something went wrong. Please try again.';
      errEl.style.display = '';
      btn.disabled    = false;
      btn.textContent = 'Set New Password';
    }
  }
});

// Sync theme from main app
const saved = localStorage.getItem('bt-theme');
if (saved) document.documentElement.dataset.theme = saved;
</script>
</body>
</html>
